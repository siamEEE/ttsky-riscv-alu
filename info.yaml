project:
  title:        "32-bit RISC-V ALU with Four-Domain Clock Gating"
  author:       "Siam"
  discord:      ""
  description:  "32-bit RISC-V ALU with four clock-gated functional domains implemented in SKY130 using LibreLane"
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "2x2"

  top_module: "tt_um_siameee_riscv_alu"

  source_files:
    - "project.v"
    - "alu_clock_gated_4d.v"
    - "alu_partitioned_datapath_4d.v"
    - "alu_decode.v"
    - "alu_addsub.v"
    - "adder_select_32.v"
    - "adder_behavioral_32.v"
    - "clz32_tree.v"
    - "icg_cell.v"

pinout:
  ui[0]: "data[0]"
  ui[1]: "data[1]"
  ui[2]: "data[2]"
  ui[3]: "data[3]"
  ui[4]: "data[4]"
  ui[5]: "data[5]"
  ui[6]: "data[6]"
  ui[7]: "data[7]"

  uo[0]: "result_data[0]"
  uo[1]: "result_data[1]"
  uo[2]: "result_data[2]"
  uo[3]: "result_data[3]"
  uo[4]: "result_data[4]"
  uo[5]: "result_data[5]"
  uo[6]: "result_data[6]"
  uo[7]: "result_data[7]"

  uio[0]: "command[0]"
  uio[1]: "command[1]"
  uio[2]: "command[2]"
  uio[3]: "selector[0]"
  uio[4]: "selector[1]"
  uio[5]: "selector[2]"
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
